services:
  fastapi-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: solarise-fastapi
    restart: unless-stopped
    ports:
      # Bind strictly to host loopback; reverse proxy (Caddy/Nginx) handles public HTTPS
      - "127.0.0.1:8009:8009"
    environment:
      - OPENWA_URL=http://openwa-api:2785
      - OPENWA_SESSION_ID=${OPENWA_SESSION_ID:-b9290ec0-2954-4be2-a32d-111512c06f7e}
      - OPENWA_API_KEY=${OPENWA_API_KEY:?OPENWA_API_KEY must be set in .env}
      - ADMIN_API_KEY=${ADMIN_API_KEY:?ADMIN_API_KEY must be set in .env}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:?WEBHOOK_SECRET must be set in .env}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env}
      - BUSINESS_NUMBER=${BUSINESS_NUMBER:-}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://127.0.0.1:8009}
      - LEADS_DB_PATH=${LEADS_DB_PATH:-solarise_leads.db}
    volumes:
      # Persistent SQLite database mount (mounts the host database file into the container)
      - ./solarise_leads.db:/app/solarise_leads.db
    depends_on:
      openwa-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8009/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - solarise-internal

  openwa-api:
    image: ${OPENWA_IMAGE:-openwa-openwa}
    container_name: solarise-openwa
    restart: unless-stopped
    # Port 2785 is strictly private to internal Docker network; not mapped to host/public
    environment:
      - NODE_ENV=production
      - API_MASTER_KEY=${OPENWA_API_KEY:?OPENWA_API_KEY must be set in .env}
      - SESSION_DATA_PATH=/app/data/sessions
      - PORT=2785
      - AUTO_START_SESSIONS=true
      - LOG_LEVEL=info
      - PUPPETEER_ARGS=--no-sandbox,--disable-setuid-sandbox,--disable-dev-shm-usage,--disable-gpu
      - SSRF_ALLOWED_HOSTS=fastapi-app,host.docker.internal
    volumes:
      # Persistent OpenWA session storage (preserves WhatsApp Web authentication)
      - openwa-sessions:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2785/api/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - solarise-internal

volumes:
  openwa-sessions:
    driver: local

networks:
  solarise-internal:
    driver: bridge
